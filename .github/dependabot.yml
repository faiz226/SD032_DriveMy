version: 2

# npm audit only runs when someone pushes. Dependabot is what watches for
# newly disclosed advisories in between — which is most of the time.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Keep the noise down: batch low-risk updates, but let anything with a
      # security advisory come through on its own so it is reviewed properly.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # React 19 / Vite 8 / TypeScript 6 majors are deliberate, coordinated
      # upgrades — not something to take from an automated PR.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
