name: Secret Scan

# A live third-party API key sat unreferenced in .env.local for weeks. It was
# gitignored and never committed — but nothing in the pipeline would have
# noticed if it had been. gitleaks scans the working tree and, on push, the
# commit range, so a leaked credential fails the build instead of shipping.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the scan covers the whole commit range, not just
          # the tip — a secret added and then "removed" still lives in history.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
